<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Terra Volcano · Registro</title>
<style>
:root{--obsidiana:#14110F;--lava:#D64A1E;--araucaria:#2F5D4A;--nieve:#F2EDE6;--linea:rgba(20,17,15,.14)}
*{box-sizing:border-box}
body{margin:0;background:var(--nieve);color:var(--obsidiana);
     font:16px/1.55 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
header{background:var(--obsidiana);color:var(--nieve);padding:16px 20px;display:flex;
       justify-content:space-between;align-items:center;gap:12px}
header b{font-size:16px}
.idioma button{background:transparent;border:1px solid rgba(242,237,230,.35);color:var(--nieve);
  border-radius:999px;padding:6px 12px;font:600 12px/1 inherit;cursor:pointer;margin-left:4px}
.idioma button[aria-pressed=true]{background:var(--nieve);color:var(--obsidiana)}
main{max-width:620px;margin:0 auto;padding:24px 18px 120px}
h1{font-size:23px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:#6b625a;font-size:14px;margin:0 0 26px}
fieldset{border:1px solid var(--linea);border-radius:5px;background:#fff;padding:16px;margin:0 0 16px}
legend{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--lava);
       font-weight:700;padding:0 6px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px}
input[type=text],input[type=email],input[type=tel],input[type=number],select{
  width:100%;padding:11px 12px;border:1px solid var(--linea);border-radius:4px;
  font:16px/1.3 inherit;background:#fff;color:inherit}
input:focus,select:focus{outline:2px solid var(--lava);outline-offset:-1px}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ctx{background:#faf7f3;border:1px solid var(--linea);border-radius:5px;padding:14px 16px;margin:0 0 18px;font-size:14px}
.ctx dt{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#6b625a;margin-top:8px}
.ctx dt:first-child{margin-top:0}
.ctx dd{margin:2px 0 0;font-weight:600}
.decl{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;
      padding:9px 0;border-bottom:1px solid var(--linea);font-size:14px}
.decl:last-of-type{border-bottom:0}
.decl span{font-weight:600}
.decl label{display:flex;align-items:center;gap:5px;margin:0;font-weight:500;font-size:13px}
.detalle{grid-column:1/-1;margin-top:-2px}
.riesgo{max-height:210px;overflow-y:auto;border:1px solid var(--linea);border-radius:4px;
        padding:14px;background:#faf7f3;white-space:pre-wrap;font-size:14px}
.casilla{display:flex;gap:11px;align-items:flex-start;margin:14px 0;font-size:14px;line-height:1.45}
.casilla input{margin-top:3px;width:19px;height:19px;flex:none}
.casilla .opt{color:#6b625a;font-size:12px;display:block}
canvas{width:100%;height:170px;border:1px dashed var(--linea);border-radius:4px;
       background:#fff;touch-action:none;display:block}
.btn{width:100%;padding:16px;border:0;border-radius:4px;background:var(--lava);color:#fff;
     font:700 16px/1 inherit;cursor:pointer;margin-top:18px}
.btn:disabled{background:#c9c2bb;cursor:not-allowed}
.aviso{background:#FDF0E8;border:1px solid var(--lava);border-radius:4px;padding:12px 14px;
       font-size:14px;margin:14px 0}
.ok{text-align:center;padding:40px 10px}
.ok h2{font-size:22px;margin:0 0 10px}
@media (max-width:520px){.fila{grid-template-columns:1fr}}
</style></head>
<body>
<header><b>Terra Volcano</b>
  <div class="idioma"><button data-l="es" aria-pressed="true">ES</button><button data-l="en">EN</button></div>
</header>
<main id="app">…</main>

<script>
const T = {
  es: {titulo:'Registro y aceptación de riesgo', sub:'Servicios de turismo aventura · Decreto N°19/2018. Completa este formulario antes de tu salida.',
    actividad:'Tu salida', personales:'Datos personales', nombre:'Nombre completo', nacionalidad:'Nacionalidad',
    doctipo:'Tipo de documento', pasaporte:'Pasaporte', rut:'RUT', docnum:'Número de documento',
    edad:'Edad', peso:'Peso (kg)', menor:'Soy menor de edad y me acompaña un tutor',
    tutor:'Nombre del tutor', tutordoc:'Documento del tutor',
    emergencia:'Contacto en caso de emergencia', emerg1:'Primer contacto', emerg2:'Segundo contacto (opcional)',
    telefono:'Teléfono', email:'Correo', declaracion:'Declaración', si:'Sí', no:'No', especificar:'Especificar',
    d_exp:'Experiencia en la misma actividad', d_seg:'¿Tiene seguro?', d_ale:'Alergias',
    d_med:'Medicamentos contraindicados', d_die:'Dietas especiales', d_cir:'Cirugías recientes',
    d_emb:'Embarazo', d_otr:'Otros',
    riesgo:'Aceptación de riesgo', leer:'Desplázate hasta el final para poder aceptar',
    c_riesgo:'He leído y acepto la declaración de riesgo', c_riesgo_o:'Obligatorio para participar',
    c_imagen:'Autorizo el uso de mi imagen en redes sociales y el sitio web', c_imagen_o:'Opcional. No condiciona tu participación',
    c_mkt:'Quiero recibir ofertas y novedades de Terra Volcano', c_mkt_o:'Opcional. Puedes darte de baja cuando quieras',
    firma:'Firma', firmaayuda:'Firma con el dedo o el mouse dentro del recuadro', borrar:'Borrar firma',
    enviar:'Firmar y enviar', listo:'¡Listo!', listotxt:'Tu registro quedó firmado. Te enviamos una copia por correo.',
    verpdf:'Ver mi formulario', yafirmado:'Este formulario ya fue firmado.',
    err_firma:'Falta firmar en el recuadro.', err_riesgo:'Debes aceptar la declaración de riesgo.',
    err_emerg:'Falta el primer contacto de emergencia.', err_edad:'La edad mínima para esta actividad es ',
    err_tutor:'Falta el nombre del tutor.'},
  en: {titulo:'Registration and acceptance of risk', sub:'Adventure tourism services · Decree N°19/2018. Please complete this form before your departure.',
    actividad:'Your departure', personales:'Personal data', nombre:'Full name', nacionalidad:'Nationality',
    doctipo:'Document type', pasaporte:'Passport', rut:'RUT', docnum:'Document number',
    edad:'Age', peso:'Weight (kg)', menor:'I am a minor and a guardian accompanies me',
    tutor:'Guardian name', tutordoc:'Guardian document',
    emergencia:'Contact in case of emergency', emerg1:'First contact', emerg2:'Second contact (optional)',
    telefono:'Phone', email:'E-mail', declaracion:'Declaration', si:'Yes', no:'No', especificar:'Specify',
    d_exp:'Experience in the same activity', d_seg:'Do you have insurance?', d_ale:'Allergies',
    d_med:'Medications contraindicated', d_die:'Special diets (food)', d_cir:'Recent medical surgeries',
    d_emb:'Pregnancy', d_otr:'Others',
    riesgo:'Acceptance of risk', leer:'Scroll to the end to be able to accept',
    c_riesgo:'I have read and accept the risk declaration', c_riesgo_o:'Required to take part',
    c_imagen:'I authorise the use of my image on social media and the website', c_imagen_o:'Optional. It does not affect your participation',
    c_mkt:'I want to receive offers and news from Terra Volcano', c_mkt_o:'Optional. You can unsubscribe at any time',
    firma:'Signature', firmaayuda:'Sign with your finger or mouse inside the box', borrar:'Clear signature',
    enviar:'Sign and submit', listo:'Done!', listotxt:'Your registration is signed. We have emailed you a copy.',
    verpdf:'View my form', yafirmado:'This form has already been signed.',
    err_firma:'Please sign in the box.', err_riesgo:'You must accept the risk declaration.',
    err_emerg:'The first emergency contact is required.', err_edad:'Minimum age for this activity is ',
    err_tutor:'The guardian name is required.'}
};
const ITEMS = [['exp_actividad','d_exp'],['tiene_seguro','d_seg'],['alergias','d_ale'],
  ['medicamentos','d_med'],['dieta','d_die'],['cirugias','d_cir'],['embarazo','d_emb'],['otros','d_otr']];

const token = location.pathname.split('/').pop();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let L = 'es', datos = null, trazos = [];

document.querySelectorAll('.idioma button').forEach(b => b.onclick = () => {
  L = b.dataset.l; document.documentElement.lang = L;
  document.querySelectorAll('.idioma button').forEach(x => x.setAttribute('aria-pressed', x === b));
  pintar();
});

async function cargar() {
  const r = await fetch('/api/registro/' + token);
  if (!r.ok) { document.getElementById('app').innerHTML = '<p class="aviso">Enlace no válido.</p>'; return; }
  datos = await r.json();
  L = datos.idioma === 'en' ? 'en' : 'es';
  document.querySelectorAll('.idioma button').forEach(x => x.setAttribute('aria-pressed', x.dataset.l === L));
  pintar();
}

function pintar() {
  const t = T[L], d = datos;
  if (d.firma_id) {
    document.getElementById('app').innerHTML =
      `<div class="ok"><h2>${t.yafirmado}</h2>
       <p><a href="/imprimir/registro/${esc(token)}" target="_blank">${t.verpdf}</a></p></div>`;
    return;
  }
  document.getElementById('app').innerHTML = `
  <h1>${t.titulo}</h1><p class="sub">${t.sub}</p>

  <dl class="ctx">
    <dt>${t.actividad}</dt><dd>${esc(L === 'en' ? d.nombre_en : d.nombre_es)}</dd>
    <dt>Fecha</dt><dd>${esc(d.fecha)} · ${esc(d.hora_inicio_prevista)}–${esc(d.hora_fin_prevista)}</dd>
    <dt>${L === 'en' ? 'Guide' : 'Guía'}</dt><dd>${esc(d.guias.map(g => g.nombre + ' (' + g.documento_id + ')').join(', '))}</dd>
    <dt>${L === 'en' ? 'Departure → Arrival' : 'Salida → Llegada'}</dt><dd>${esc(d.lugar_salida)} → ${esc(d.lugar_llegada)}</dd>
    <dt>${L === 'en' ? 'Itinerary' : 'Itinerario'}</dt><dd style="font-weight:400">${esc(L === 'en' ? d.itinerario_en : d.itinerario_es)}</dd>
  </dl>

  <form id="f">
  <fieldset><legend>${t.personales}</legend>
    <label>${t.nombre}</label><input type="text" name="nombre" value="${esc(d.nombre)}" required>
    <div class="fila">
      <div><label>${t.nacionalidad}</label><input type="text" name="nacionalidad" value="${esc(d.nacionalidad || '')}" required></div>
      <div><label>${t.doctipo}</label><select name="documento_tipo">
        <option value="pasaporte">${t.pasaporte}</option><option value="rut">${t.rut}</option></select></div>
    </div>
    <label>${t.docnum}</label><input type="text" name="documento_numero" value="${esc(d.documento_numero || '')}" required>
    <div class="fila">
      <div><label>${t.edad}</label><input type="number" name="edad" min="1" max="110" required></div>
      <div><label>${t.peso}</label><input type="number" name="peso_kg" min="20" max="250" step="0.5" required></div>
    </div>
    <div class="casilla"><input type="checkbox" id="menor" name="es_menor">
      <label for="menor" style="margin:0;font-weight:500">${t.menor}</label></div>
    <div id="bloqueTutor" hidden>
      <label>${t.tutor}</label><input type="text" name="tutor_nombre">
      <label>${t.tutordoc}</label><input type="text" name="tutor_documento">
    </div>
  </fieldset>

  <fieldset><legend>${t.emergencia}</legend>
    <label>${t.emerg1} — ${t.nombre}</label><input type="text" name="e1_nombre" required>
    <div class="fila">
      <div><label>${t.telefono}</label><input type="tel" name="e1_telefono" required></div>
      <div><label>${t.email}</label><input type="email" name="e1_email"></div>
    </div>
    <label style="margin-top:18px">${t.emerg2} — ${t.nombre}</label><input type="text" name="e2_nombre">
    <div class="fila">
      <div><label>${t.telefono}</label><input type="tel" name="e2_telefono"></div>
      <div><label>${t.email}</label><input type="email" name="e2_email"></div>
    </div>
  </fieldset>

  <fieldset><legend>${t.declaracion}</legend>
    ${ITEMS.map(([k, lab]) => `
      <div class="decl"><span>${t[lab]}</span>
        <label><input type="radio" name="${k}" value="1">${t.si}</label>
        <label><input type="radio" name="${k}" value="0" checked>${t.no}</label>
        <input class="detalle" type="text" name="${k}_detalle" placeholder="${t.especificar}" hidden>
      </div>`).join('')}
  </fieldset>

  <fieldset><legend>${t.riesgo}</legend>
    <p class="sub" style="margin:0 0 8px">${t.leer}</p>
    <div class="riesgo" id="riesgo">${esc(d.declaracion[L])}</div>
    <div class="casilla"><input type="checkbox" id="cr" disabled>
      <label for="cr" style="margin:0;font-weight:500">${t.c_riesgo}<span class="opt">${t.c_riesgo_o}</span></label></div>
    <div class="casilla"><input type="checkbox" id="ci">
      <label for="ci" style="margin:0;font-weight:500">${t.c_imagen}<span class="opt">${t.c_imagen_o}</span></label></div>
    <div class="casilla"><input type="checkbox" id="cm">
      <label for="cm" style="margin:0;font-weight:500">${t.c_mkt}<span class="opt">${t.c_mkt_o}</span></label></div>
  </fieldset>

  <fieldset><legend>${t.firma}</legend>
    <p class="sub" style="margin:0 0 8px">${t.firmaayuda}</p>
    <canvas id="c"></canvas>
    <button type="button" class="btn" id="borrar" style="background:#fff;color:inherit;border:1px solid var(--linea);margin-top:8px">${t.borrar}</button>
  </fieldset>

  <div id="error"></div>
  <button class="btn" id="enviar">${t.enviar}</button>
  </form>`;

  // Detalle visible solo al marcar "sí"
  for (const [k] of ITEMS) {
    const det = document.querySelector(`[name="${k}_detalle"]`);
    document.querySelectorAll(`[name="${k}"]`).forEach(r =>
      r.onchange = () => { det.hidden = r.value !== '1'; if (det.hidden) det.value = ''; });
  }
  document.getElementById('menor').onchange = (e) =>
    document.getElementById('bloqueTutor').hidden = !e.target.checked;

  // El consentimiento de riesgo se habilita solo al leer hasta el final
  const caja = document.getElementById('riesgo'), cr = document.getElementById('cr');
  const revisar = () => { if (caja.scrollTop + caja.clientHeight >= caja.scrollHeight - 8) cr.disabled = false; };
  caja.addEventListener('scroll', revisar); revisar();

  firmaCanvas();
  document.getElementById('f').onsubmit = (e) => { e.preventDefault(); enviar(); };
}

function firmaCanvas() {
  const c = document.getElementById('c'), ctx = c.getContext('2d');
  const r = devicePixelRatio || 1;
  c.width = c.offsetWidth * r; c.height = c.offsetHeight * r; ctx.scale(r, r);
  ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#14110F';
  let dibujando = false;
  const pos = (e) => { const b = c.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e; return [p.clientX - b.left, p.clientY - b.top]; };
  const ini = (e) => { e.preventDefault(); dibujando = true; trazos.push(1);
    const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); };
  const mov = (e) => { if (!dibujando) return; e.preventDefault();
    const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); };
  const fin = () => { dibujando = false; };
  c.addEventListener('mousedown', ini); c.addEventListener('mousemove', mov);
  addEventListener('mouseup', fin);
  c.addEventListener('touchstart', ini, { passive: false });
  c.addEventListener('touchmove', mov, { passive: false });
  c.addEventListener('touchend', fin);
  document.getElementById('borrar').onclick = () => {
    ctx.clearRect(0, 0, c.width, c.height); trazos = [];
  };
}

async function enviar() {
  const t = T[L], f = document.getElementById('f'), v = (n) => (f[n] ? f[n].value.trim() : '');
  const err = document.getElementById('error');
  const marcado = (n) => f.querySelector(`[name="${n}"]:checked`)?.value === '1';
  err.innerHTML = '';
  const fallo = (m) => { err.innerHTML = `<div class="aviso">${esc(m)}</div>`;
                         err.scrollIntoView({ behavior: 'smooth', block: 'center' }); };

  if (!document.getElementById('cr').checked) return fallo(t.err_riesgo);
  if (!trazos.length) return fallo(t.err_firma);
  if (!v('e1_nombre')) return fallo(t.err_emerg);
  if (f.es_menor.checked && !v('tutor_nombre')) return fallo(t.err_tutor);
  if (!f.es_menor.checked && datos.edad_minima && +v('edad') < datos.edad_minima)
    return fallo(t.err_edad + datos.edad_minima);

  const cuerpo = { idioma: L, nombre: v('nombre'), nacionalidad: v('nacionalidad'),
    documento_tipo: v('documento_tipo'), documento_numero: v('documento_numero'),
    edad: v('edad'), peso_kg: v('peso_kg'),
    es_menor: f.es_menor.checked, tutor_nombre: v('tutor_nombre'), tutor_documento: v('tutor_documento'),
    contactos: [{ nombre: v('e1_nombre'), telefono: v('e1_telefono'), email: v('e1_email') },
                { nombre: v('e2_nombre'), telefono: v('e2_telefono'), email: v('e2_email') }],
    acepto_riesgo: true, acepto_imagen: document.getElementById('ci').checked,
    acepto_marketing: document.getElementById('cm').checked,
    firma_png: document.getElementById('c').toDataURL('image/png') };
  for (const [k] of ITEMS) { cuerpo[k] = marcado(k); cuerpo[k + '_detalle'] = v(k + '_detalle'); }

  const r = await fetch('/api/registro/' + token, { method: 'POST',
    headers: { 'content-type': 'application/json' }, body: JSON.stringify(cuerpo) });
  const out = await r.json();
  if (!r.ok) return fallo(out.error === 'edad_minima' ? t.err_edad + out.minima : out.error);
  document.getElementById('app').innerHTML =
    `<div class="ok"><h2>${t.listo}</h2><p>${t.listotxt}</p>
     <p><a href="/imprimir/registro/${esc(token)}" target="_blank">${t.verpdf}</a></p></div>`;
}

cargar();
</script></body></html>
